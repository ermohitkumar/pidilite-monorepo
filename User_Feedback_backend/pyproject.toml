[project]
name = "User_Feedback_backend"
version = "0.1.0"
description = "User Feedback Authentication and Dashboard operations"
authors = [
    {name = "Pidilite Team"}
]
requires-python = "^3.11"


[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.111.0"
uvicorn = {version = "0.29.0", extras = ["standard"]}
sqlalchemy = "2.0.30"
psycopg2-binary = "2.9.9"
pydantic = "2.7.1"
pydantic-settings = "2.2.1"
python-dotenv = "1.0.1"
python-multipart = "0.0.9"
itsdangerous = "2.2.0"
bcrypt = ">=4.0.0,<5.0.0"
httpx = "0.27.0"
PyJWT = {extras = ["crypto"], version = "^2.13.0"}


[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:google._upb._message",
    "ignore::DeprecationWarning:importlib._bootstrap",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "autopep8 (>=2.3.2,<3.0.0)"
]